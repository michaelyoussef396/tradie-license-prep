    <!--
      Analytics — GA4, Google Ads and Microsoft Clarity — the only place they load.
      GA4 records the first page view itself (config) and later client-side route
      changes through enhanced measurement's browser-history page views, so the app
      sends no GA4 page_view; it sends only a Google Ads-only page_view on client-side
      route changes (trackAdsPageView). Nothing loads on internal routes (admin and the
      student dashboard): keep this pattern in step with INTERNAL_PATH_PREFIXES in
      src/lib/analytics.ts.
    -->
    <script>
      (function () {
        if (/^\/(admin|email-templates|dashboard)/.test(window.location.pathname)) return;

        function load(src) {
          var s = document.createElement("script");
          s.async = true;
          s.src = src;
          document.head.appendChild(s);
        }

        // Google tag (gtag.js): GA4 + Google Ads. One library load: the GA4 tag fetches the
        // Ads destination itself when it sees the AW config (gtag/js?id=AW-…&cx=c), so a
        // second explicit load of gtag/js?id=AW-… only downloaded the same ~490 KB again.
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag("js", new Date());
        window.gtag("config", "G-PDWZPMEMZB");
        window.gtag("config", "AW-18192612568");
        load("https://www.googletagmanager.com/gtag/js?id=G-PDWZPMEMZB");

        // Microsoft Clarity
        (function (c, l, a, r, i, t, y) {
          c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
          t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
          y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "w4ahhdceh3");
      })();
    </script>
