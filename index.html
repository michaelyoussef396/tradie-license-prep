    <!--
      Analytics — GA4, Google Ads and Microsoft Clarity — the only place they load.
      GA4 records the first page view itself (config) and later client-side route
      changes through enhanced measurement's browser-history page views, so the app
      sends no GA4 page_view; it sends only a Google Ads-only page_view on client-side
      route changes (trackAdsPageView). Nothing loads on internal routes (admin and the
      student dashboard): keep this pattern in step with INTERNAL_PATH_PREFIXES in
      src/lib/analytics.ts. The tag scripts themselves start loading at first paint.
    -->
    <script>
      (function () {
        if (/^\/(admin|email-templates|dashboard)/.test(window.location.pathname)) return;

        function load(src) {
          var s = document.createElement("script");
          s.async = true;
          s.src = src;
          document.head.appendChild(s);
        }

        // Google tag (gtag.js): GA4 + Google Ads. The commands queue in dataLayer
        // straight away; the library that sends them loads once the page has painted.
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag("js", new Date());
        window.gtag("config", "G-PDWZPMEMZB");
        window.gtag("config", "AW-18192612568");

        // Microsoft Clarity's queue, same idea.
        window.clarity = window.clarity || function () { (window.clarity.q = window.clarity.q || []).push(arguments); };

        // The tag scripts (about 365 KB compressed, PageSpeed, 22 Oct 2026) used to start
        // first thing and compete with the page's own JavaScript, so the page became usable
        // later on slow phones. They now start at first contentful paint, or at the load
        // event in browsers that can't report paint — a fraction of a second later than
        // before. Everything queued until then is sent when they arrive, with the URL at
        // that moment: nothing may change the URL (navigate, replaceState, stripping query
        // parameters) before they've loaded, or the landing page's gclid/UTMs are lost.
        // A visit that ends before they load isn't recorded.
        function loadTags() {
          load("https://www.googletagmanager.com/gtag/js?id=G-PDWZPMEMZB");
          load("https://www.googletagmanager.com/gtag/js?id=AW-18192612568");
          load("https://www.clarity.ms/tag/w4ahhdceh3");
        }
        var started = false;
        function start() {
          if (!started) { started = true; loadTags(); }
        }
        try {
          new PerformanceObserver(function (list) {
            if (list.getEntriesByName("first-contentful-paint").length) start();
          }).observe({ type: "paint", buffered: true });
        } catch (e) {}
        window.addEventListener("load", start, { once: true });
      })();
    </script>
